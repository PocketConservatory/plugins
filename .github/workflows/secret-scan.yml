name: Secret scan

# Scans the full git history with gitleaks so a committed credential (e.g. a
# service-account private key pasted from .env.local) fails the PR before it
# merges. The gitleaks CLI is used directly instead of gitleaks-action, which
# requires a paid license for organization repos. Exits non-zero on findings;
# --redact keeps any matched values out of the CI logs.

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret is a leak even when a later commit removes it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Scans the checked-out commit's history (the PR merge commit, or the pushed
      # branch). gitleaks' default adds `--all`, and a full-depth checkout fetches
      # every branch, so one unmerged branch's finding would fail every PR.
      - name: Scan git history
        run: ./gitleaks git --no-banner --redact --log-opts="--full-history HEAD" .
